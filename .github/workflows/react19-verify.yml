name: React 19 build verification
on:
  push:
    branches: [modern-react19-vite]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, build and test
        run: npm test
      - name: Save production bundle for browser smoke test
        uses: actions/upload-artifact@v4
        with:
          name: certifyflow-react19-dist
          path: dist/
          retention-days: 1
